services:
  mysql:
    image: mysql:8.4
    container_name: cashff-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cashff_db
      MYSQL_USER: cashff
      MYSQL_PASSWORD: cashff_dev_password
      MYSQL_ROOT_PASSWORD: "Sairam@1"
    ports:
      - "3306:3306"
    volumes:
      - cashff_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pSairam@1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  cashff_mysql_data:
