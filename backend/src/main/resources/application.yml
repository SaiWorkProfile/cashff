server:
  port: ${PORT:8080}
  error:
    include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cashff_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me-now}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 25MB
app:
  jwt-secret: ${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-bytes}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:change-me-now}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
